name: Continuous Integration & Deployment (LAIX RAG Service)

on:
  push:
    branches:
      - main
      - master

# The workflow only reads repository contents. Production credentials are read
# directly from GitHub Actions secrets by the deployment job.
permissions:
  contents: read

# Never deploy two revisions to the same VPS concurrently. A later push waits
# for the active deployment instead of interrupting it halfway through.
concurrency:
  group: laix-rag-production
  cancel-in-progress: false

jobs:
  test:
    name: Run deterministic tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: pip install ".[dev]" --extra-index-url https://download.pytorch.org/whl/cpu
      - name: Run tests
        run: python -m pytest tests -q

  deploy:
    name: Deploy to Production VPS
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup SSH Agent & Key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      - name: Add VPS to Known Hosts
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          ssh-keyscan -p ${{ secrets.VPS_PORT }} -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Sync Code Files to VPS via Rsync
        run: |
          # 1. Crear directorio remoto si no existe
          ssh -p ${{ secrets.VPS_PORT }} ${{ secrets.VPS_USERNAME }}@${{ secrets.VPS_HOST }} "sudo mkdir -p /opt/laix-rag && sudo chown -R \$USER:\$USER /opt/laix-rag"

          # 2. Sincronizar un espejo del repositorio. Las exclusiones conservan
          # los datos, secretos y volúmenes persistentes que existen en el VPS.
          rsync -avz --delete-delay -e "ssh -p ${{ secrets.VPS_PORT }}" \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='.env' \
            --exclude='.venv' \
            --exclude='data' \
            --exclude='postgres_data*' \
            ./ ${{ secrets.VPS_USERNAME }}@${{ secrets.VPS_HOST }}:/opt/laix-rag/

      - name: Restart & Verify Production Services on VPS
        env:
          ENV_FILE_CONTENT: ${{ secrets.ENV_FILE_CONTENT }}
        run: |
          if [ -z "$ENV_FILE_CONTENT" ]; then
            echo "::error::ENV_FILE_CONTENT is missing or empty."
            exit 1
          fi

          for required_key in POSTGRES_PASSWORD SERVICE_API_TOKEN; do
            if ! printf '%s\n' "$ENV_FILE_CONTENT" | grep -Eq "^${required_key}=.+$"; then
              echo "::error::ENV_FILE_CONTENT must define a non-empty ${required_key}."
              exit 1
            fi
          done

          ssh -p ${{ secrets.VPS_PORT }} ${{ secrets.VPS_USERNAME }}@${{ secrets.VPS_HOST }} "ENV_CONTENT=\$(cat << 'EOFENV'
          ${ENV_FILE_CONTENT}
          EOFENV
          ) bash -s" << 'EOF'
            set -e
            echo "🚀 Ejecutando Despliegue en VPS..."

            cd /opt/laix-rag

            # 1. Escribir archivo .env de producción
            if [ -n "$ENV_CONTENT" ]; then
              echo "$ENV_CONTENT" > .env
            fi

            # Las fuentes manuales viven fuera del checkout y sobreviven rsync,
            # recreaciones de contenedores y despliegues.
            SOURCE_DIR=${PIPELINE_SOURCE_HOST_PATH:-/data/laix-rag/source}
            $SUDO mkdir -p "$SOURCE_DIR"/{jurisprudencia,documentos,registro_oficial,leyes}
            $SUDO chown -R "$(id -u):$(id -g)" "$SOURCE_DIR"

            # El scraper se ejecuta en el worker Docker; no se instala Python ni Playwright en el host.
            # El scheduler se activa después de que los contenedores estén disponibles.
            echo "⏱️ Instalando scheduler relativo del pipeline público..."
            SUDO=""
            if [ "$(id -u)" -ne 0 ]; then
              SUDO="sudo"
            fi
            $SUDO install -D -m 644 deploy/systemd/laix-public-pipeline.service /etc/systemd/system/laix-public-pipeline.service
            $SUDO install -D -m 644 deploy/systemd/laix-certbot-renew.service /etc/systemd/system/laix-certbot-renew.service
            $SUDO install -D -m 644 deploy/systemd/laix-certbot-renew.timer /etc/systemd/system/laix-certbot-renew.timer
            $SUDO systemctl daemon-reload
            $SUDO systemctl enable laix-public-pipeline.service
            $SUDO systemctl enable --now laix-certbot-renew.timer

            # 2. Determinar comando docker compose y permisos
            SUDO=""
            if [ "$(id -u)" -ne 0 ]; then
              SUDO="sudo"
            fi

            if command -v docker-compose &> /dev/null; then
              DOCKER_COMPOSE_CMD="docker-compose"
            else
              DOCKER_COMPOSE_CMD="docker compose"
            fi

            # Docker must not reuse a stale dependency layer when pyproject.toml
            # changes. In particular, passlib 1.7.x requires bcrypt < 5.
            build_web_services() {
              $SUDO $DOCKER_COMPOSE_CMD -f docker-compose.prod.yml build api dashboard nginx
              if ! $SUDO docker run --rm laix-rag-api python -c 'import importlib.metadata as m; assert int(m.version("bcrypt").split(".", 1)[0]) < 5' >/dev/null; then
                echo "♻️ Imagen API con bcrypt incompatible; reconstruyendo servicios web sin caché..."
                $SUDO $DOCKER_COMPOSE_CMD -f docker-compose.prod.yml build --no-cache api dashboard nginx
              fi
            }

            # 3. Nunca interrumpir un lote activo: el worker puede estar
            # ejecutando OCR, descarga o RAG parcial durante un despliegue.
            ACTIVE_PIPELINE=$($SUDO $DOCKER_COMPOSE_CMD -f docker-compose.prod.yml exec -T api python -c 'from app.core.database import SessionLocal; from app.pipeline.models import PipelineRun, PipelineRunStatus; db = SessionLocal(); print("1" if db.query(PipelineRun).filter(PipelineRun.status.in_((PipelineRunStatus.PENDING.value, PipelineRunStatus.RUNNING.value, PipelineRunStatus.PAUSED.value))).first() else "0"); db.close()' 2>/dev/null || echo "0")

            if [ "$ACTIVE_PIPELINE" = "1" ]; then
              echo "🛡️ Lote activo detectado: se conserva el worker sin reiniciarlo."
              echo "🐳 Compilando únicamente servicios web..."
              build_web_services
              echo "🐳 Actualizando API, dashboard y Nginx..."
              $SUDO $DOCKER_COMPOSE_CMD -f docker-compose.prod.yml up -d api dashboard nginx
            else
              echo "🐳 Compilando imágenes Docker..."
              $SUDO $DOCKER_COMPOSE_CMD -f docker-compose.prod.yml build
              if ! $SUDO docker run --rm laix-rag-api python -c 'import importlib.metadata as m; assert int(m.version("bcrypt").split(".", 1)[0]) < 5' >/dev/null; then
                echo "♻️ Imagen API con bcrypt incompatible; reconstruyendo sin caché..."
                $SUDO $DOCKER_COMPOSE_CMD -f docker-compose.prod.yml build --no-cache
              fi
              echo "🐳 Levantando contenedores..."
              $SUDO $DOCKER_COMPOSE_CMD -f docker-compose.prod.yml up -d
            fi

            # Evita que capas y cachés de compilaciones antiguas llenen el disco
            # raíz. Solo corre bajo presión y nunca elimina contenedores o volúmenes.
            FREE_KB=$(df -Pk / | awk 'NR==2 {print $4}')
            MIN_FREE_KB=$((30 * 1024 * 1024))
            if [ "$FREE_KB" -lt "$MIN_FREE_KB" ]; then
              echo "🧹 Menos de 30 GB libres en /; limpiando Docker no usado..."
              $SUDO docker image prune -af
              $SUDO docker builder prune -af --filter "until=168h"
            fi

            echo "⏱️ Iniciando scheduler relativo del pipeline público..."
            $SUDO systemctl restart laix-public-pipeline.service

            # Forzar reinicio de Nginx para evitar que cachee la IP antigua del contenedor de la API
            echo "🔄 Reiniciando proxy Nginx..."
            $SUDO $DOCKER_COMPOSE_CMD -f docker-compose.prod.yml restart nginx

            # 4. Comprobar salud del servicio con bucle de tolerancia (hasta 15 segundos)
            echo "⏳ Verificando salud del servicio..."
            HEALTH_STATUS=""
            for i in {1..20}; do
              sleep 2
              HEALTH_STATUS=$(curl -ks --resolve api.viant.online:443:127.0.0.1 https://api.viant.online/health | grep -o '"status":"healthy"' || true)
              if [ "$HEALTH_STATUS" = '"status":"healthy"' ]; then
                break
              fi
            done

            if [ "$HEALTH_STATUS" = '"status":"healthy"' ]; then
              echo "✅ Despliegue exitoso. El servicio RAG responde 'healthy'."
            else
              echo "❌ Advertencia: La verificación de salud devolvió un estado no esperado."
              echo "📋 Logs del contenedor API:"
              $SUDO $DOCKER_COMPOSE_CMD -f docker-compose.prod.yml logs --tail 30 api || true
              exit 1
            fi
          EOF
