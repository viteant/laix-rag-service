name: Continuous Integration & Deployment (LAIX RAG Service)

on:
  push:
    branches:
      - main
      - master

jobs:
  deploy:
    name: Deploy to Production VPS
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/vps
          chmod 600 ~/.ssh/vps

          ssh-keyscan \
            -p "${{ secrets.VPS_PORT }}" \
            -H "${{ secrets.VPS_HOST }}" \
            >> ~/.ssh/known_hosts

          chmod 600 ~/.ssh/known_hosts

      - name: Test SSH Connection
        shell: bash
        run: |
          set -euo pipefail

          ssh \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o ConnectTimeout=15 \
            -i ~/.ssh/vps \
            -p "${{ secrets.VPS_PORT }}" \
            "${{ secrets.VPS_USERNAME }}@${{ secrets.VPS_HOST }}" \
            "echo 'SSH connection successful'; whoami; hostname"

      - name: Execute Deployment Commands on VPS
        shell: bash
        run: |
          set -euo pipefail

          ssh \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -i ~/.ssh/vps \
            -p "${{ secrets.VPS_PORT }}" \
            "${{ secrets.VPS_USERNAME }}@${{ secrets.VPS_HOST }}" \
            "bash -s -- '${{ github.repository }}'" \
            < scripts/deploy_vps.sh