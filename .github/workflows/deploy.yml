name: Continuous Integration & Deployment (LAIX RAG Service)

on:
  push:
    branches:
      - main
      - master

jobs:
  deploy:
    name: Deploy to Production VPS
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup SSH Agent & Key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      - name: Add VPS to Known Hosts
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          ssh-keyscan -p ${{ secrets.VPS_PORT }} -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Execute Deployment Commands on VPS
        run: |
          ssh -p ${{ secrets.VPS_PORT }} ${{ secrets.VPS_USERNAME }}@${{ secrets.VPS_HOST }} << 'EOF'
            set -e
            echo "🚀 Iniciando Despliegue Automático en VPS..."

            # 1. Crear directorio del servicio si no existe
            mkdir -p /opt/laix-rag
            cd /opt/laix-rag

            # 2. Clunar repo si no existe .git, o hacer pull si ya existe
            if [ ! -d ".git" ]; then
              git clone https://github.com/${{ github.repository }}.git .
            fi

            git fetch --all
            git reset --hard origin/main

            # 3. Escribir archivo .env desde secret de GitHub
            cat << 'ENVEOF' > .env
${{ secrets.ENV_FILE_CONTENT }}
ENVEOF

            # 4. Compilar y levantar contenedores en producción
            docker compose -f docker-compose.prod.yml up -d --build

            # 5. Limpiar imágenes antiguas
            docker image prune -f

            # 6. Comprobar salud del servicio
            echo "⏳ Verificando salud del servicio..."
            sleep 5
            HEALTH_STATUS=$(curl -s http://localhost/health | grep -o '"status":"healthy"' || true)

            if [ "$HEALTH_STATUS" = '"status":"healthy"' ]; then
              echo "✅ Despliegue exitoso. El servicio RAG responde 'healthy'."
            else
              echo "❌ Advertencia: La verificación de salud devolvió un estado no esperado."
            fi
          EOF
